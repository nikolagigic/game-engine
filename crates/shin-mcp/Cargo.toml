[package]
name = "shin-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MCP (Model Context Protocol) server exposing the Shin engine's tool registry over stdio."

[lib]
name = "shin_mcp"
path = "src/lib.rs"

[[bin]]
name = "shin-mcp"
path = "src/main.rs"
# The library carries the docs; a bin of the same name would collide.
doc = false

[dependencies]
shin-engine = { path = "../shin-engine" }
rmcp = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }

[dev-dependencies]
# Already an engine dependency; the integration tests decode rendered PNGs.
image = { workspace = true }
